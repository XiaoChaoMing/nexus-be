name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  # One job per Go module of go.work (make nxl-lint does the same locally).
  lint:
    name: lint / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., services/identity, services/channel, services/stream, services/media, services/chat, services/safety]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --timeout=10m

  test:
    name: test / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., services/identity, services/channel, services/stream, services/media, services/chat, services/safety]
    services:
      # Repository tests of stream-svc and channel-svc (skipped when NXL_TEST_PG_URL_<SVC> is unset).
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nxl_stream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d nxl_stream"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Redis-backed tests of chat-svc and pkg/redis (skipped when NXL_TEST_REDIS_ADDR is unset).
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NXL_TEST_PG_URL_STREAM: postgres://user:pass@localhost:5432/nxl_stream?sslmode=disable
      NXL_TEST_PG_URL_CHANNEL: postgres://user:pass@localhost:5432/nxl_channel?sslmode=disable
      NXL_TEST_PG_URL_CHAT: postgres://user:pass@localhost:5432/nxl_chat?sslmode=disable
      NXL_TEST_PG_URL_IDENTITY: postgres://user:pass@localhost:5432/nxl_identity?sslmode=disable
      NXL_TEST_PG_URL_SAFETY: postgres://user:pass@localhost:5432/nxl_safety?sslmode=disable
      NXL_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Migrate the stream database
        if: matrix.module == 'services/stream'
        run: >-
          docker run --rm --network host -v "$PWD/services/stream/migrations:/migrations:ro"
          migrate/migrate:v4.18.3 -path /migrations -database "$NXL_TEST_PG_URL_STREAM" up
      - name: Create and migrate the channel database
        if: matrix.module == 'services/channel'
        run: |
          docker run --rm --network host -e PGPASSWORD=pass postgres:18.6-alpine \
            psql -h localhost -U user -d nxl_stream -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nxl_channel'
          docker run --rm --network host -v "$PWD/services/channel/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path /migrations -database "$NXL_TEST_PG_URL_CHANNEL" up
      - name: Create and migrate the chat database
        if: matrix.module == 'services/chat'
        run: |
          docker run --rm --network host -e PGPASSWORD=pass postgres:18.6-alpine \
            psql -h localhost -U user -d nxl_stream -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nxl_chat'
          docker run --rm --network host -v "$PWD/services/chat/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path /migrations -database "$NXL_TEST_PG_URL_CHAT" up
      - name: Create and migrate the identity database
        if: matrix.module == 'services/identity'
        run: |
          docker run --rm --network host -e PGPASSWORD=pass postgres:18.6-alpine \
            psql -h localhost -U user -d nxl_stream -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nxl_identity'
          docker run --rm --network host -v "$PWD/services/identity/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path /migrations -database "$NXL_TEST_PG_URL_IDENTITY" up
      - name: Create and migrate the safety database
        if: matrix.module == 'services/safety'
        run: |
          docker run --rm --network host -e PGPASSWORD=pass postgres:18.6-alpine \
            psql -h localhost -U user -d nxl_stream -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nxl_safety'
          docker run --rm --network host -v "$PWD/services/safety/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path /migrations -database "$NXL_TEST_PG_URL_SAFETY" up
      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race -covermode atomic ./...

  docker:
    name: docker / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, channel, stream, media, chat, safety]
    steps:
      - uses: actions/checkout@v7
      - name: Build image (not pushed)
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t nexuslive/${{ matrix.service }}:ci .

  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          fail_level: error
          reporter: github-pr-review
          yamllint_flags: '-d "{extends: default, rules: {truthy: disable, line-length: {max: 140}}}" .'

  hadolint:
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-hadolint@v1
        with:
          fail_level: error
          reporter: github-pr-review

  dotenv-linter:
    name: runner / dotenv-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dotenv-linter/action-dotenv-linter@v3
        with:
          reporter: github-pr-review
