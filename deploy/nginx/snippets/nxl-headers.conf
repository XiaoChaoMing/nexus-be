# Response headers of every edge response. add_header is inherited only by blocks that declare none,
# so every block with its own add_header includes this file again.

add_header X-Request-Id $req_id always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

# Empty values (origin not allowed, not a preflight) are not sent.
add_header Access-Control-Allow-Origin $nxl_cors_origin always;
add_header Access-Control-Allow-Credentials $nxl_cors_credentials always;
add_header Access-Control-Expose-Headers $nxl_cors_expose always;
add_header Access-Control-Allow-Methods $nxl_cors_methods always;
add_header Access-Control-Allow-Headers $nxl_cors_headers always;
add_header Access-Control-Max-Age $nxl_cors_max_age always;
add_header Vary Origin always;
