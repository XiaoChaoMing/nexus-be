# NexusLive edge (docs/plans/technical/2026-10-13-gd00-infra.md §4.5, GĐ1 TSD §5).
# Routing, rate limits (NXL-00 §9), CORS and security headers. GĐ5 adds signed HLS URLs (secure_link).
# Values that come from the environment (origins, rates) live in templates/nxl-edge.conf.template.
worker_processes auto;

events
{
    worker_connections 1024;
}

http
{
    # Docker's embedded DNS. Upstreams are variables, so they are resolved per request:
    # the edge starts while a service is down and follows a restarted container's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_x_request_id $req_id
    {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_upgrade $connection_upgrade
    {
        default upgrade;
        '' close;
    }

    # ---- rate limits (zones in the template): an empty key is not counted ---------------------
    map $request_method $nxl_write_key
    {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }

    map $request_method $nxl_read_key
    {
        default "";
        GET $binary_remote_addr;
        HEAD $binary_remote_addr;
    }

    limit_req_status 429;
    limit_req_log_level warn;

    # ---- CORS: $nxl_cors_origin (allowed origin or empty) comes from the template ----------------
    map $uri $nxl_admin_path
    {
        default 0;
        ~^/v1/admin(/|$) 1;
    }

    map $nxl_cors_origin $nxl_cors_credentials
    {
        default "true";
        "" "";
    }

    map $nxl_cors_origin $nxl_cors_expose
    {
        default "Retry-After, X-Request-Id";
        "" "";
    }

    map "$request_method $nxl_cors_origin" $nxl_cors_preflight
    {
        default 0;
        "~^OPTIONS ." 1;
    }

    map $nxl_cors_preflight $nxl_cors_methods
    {
        default "";
        1 "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }

    map $nxl_cors_preflight $nxl_cors_headers
    {
        default "";
        1 "Authorization, Content-Type, X-NXL-Client, X-Request-Id, Idempotency-Key";
    }

    map $nxl_cors_preflight $nxl_cors_max_age
    {
        default "";
        1 "600";
    }

    include /etc/nginx/conf.d/nxl-*.conf;

    log_format json escape=json '{"time":"$time_iso8601","requestId":"$req_id","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_addr","upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    server
    {
        listen 80 default_server;
        server_name _;

        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        include /etc/nginx/snippets/nxl-headers.conf;

        set $identity http://identity:8090;
        set $channel http://channel:8094;
        set $stream http://stream:8092;
        set $minio http://minio:9000;

        # Errors raised by the edge itself; service responses pass through untouched.
        error_page 502 503 504 = @unavailable;
        error_page 403 = @forbidden;
        error_page 404 = @not_found;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;

        # CORS preflight: answered here with the headers above (empty for an origin that is not allowed).
        if ($request_method = OPTIONS)
        {
            return 204;
        }

        location = /healthz
        {
            default_type text/plain;
            return 200 "ok\n";
        }

        # identity-svc, strict zone: login, register, password forgot/reset, e-mail verification.
        location ~ ^/v1/auth/(login|register|password/forgot|password/reset|verify-email|verify-email/resend)$
        {
            limit_req zone=nxl_auth burst=5 nodelay;
            proxy_pass $identity;
        }

        # channel-svc: public channel pages.
        location ~ ^/v1/channels(/|$)
        {
            limit_req zone=nxl_read burst=100 nodelay;
            limit_req zone=nxl_write burst=10 nodelay;
            proxy_pass $channel;
        }

        # stream-svc: Studio, live list and VODs.
        location ~ ^/v1/(studio|streams|vods)(/|$)
        {
            limit_req zone=nxl_read burst=100 nodelay;
            limit_req zone=nxl_write burst=10 nodelay;
            proxy_pass $stream;
        }

        # Realtime gateway placeholder: chat-svc serves it from GĐ3.
        location = /v1/ws
        {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"realtime gateway is not available yet"}}';
        }

        # identity-svc: everything else under /v1 (auth, JWKS, /me, creator applications, /admin).
        location /v1/
        {
            limit_req zone=nxl_read burst=100 nodelay;
            limit_req zone=nxl_write burst=10 nodelay;
            proxy_pass $identity;
        }

        # HLS segments and playlists, read straight from the MinIO bucket (streams/ is public-read).
        # Not rate limited: players poll playlists and fetch segments continuously.
        location /hls/
        {
            limit_except GET HEAD
            {
                deny all;
            }

            rewrite ^/hls/(.*)$ /nxl-media/$1 break;
            proxy_pass $minio;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Vary;

            location ~ \.m3u8$
            {
                rewrite ^/hls/(.*)$ /nxl-media/$1 break;
                proxy_pass $minio;
                proxy_hide_header Set-Cookie;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                proxy_hide_header Vary;
                proxy_hide_header Cache-Control;
                add_header Cache-Control "no-cache" always;
                include /etc/nginx/snippets/nxl-headers.conf;
            }
        }

        # Internal APIs, metrics, Swagger and anything else stay off the edge.
        location /
        {
            return 404;
        }

        location @not_found
        {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"not found"}}';
        }

        location @forbidden
        {
            default_type application/json;
            return 403 '{"error":{"code":"FORBIDDEN","message":"forbidden"}}';
        }

        location @unavailable
        {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"service unavailable"}}';
        }

        location @too_large
        {
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"payload too large"}}';
        }

        location @rate_limited
        {
            default_type application/json;
            add_header Retry-After 60 always;
            include /etc/nginx/snippets/nxl-headers.conf;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"too many requests, try again later","details":{"retryAfterSec":"60"}}}';
        }
    }
}
