basePath: /v1
definitions:
  CategoryRef:
    properties:
      id:
        type: string
    type: object
  Channel:
    properties:
      avatarUrl:
        type: string
      displayName:
        type: string
      handle:
        type: string
      id:
        type: string
    type: object
  ContinueItem:
    properties:
      positionSec:
        type: integer
      updatedAt:
        type: string
      vod:
        $ref: '#/definitions/VOD'
    type: object
  ContinueList:
    properties:
      items:
        items:
          $ref: '#/definitions/ContinueItem'
        type: array
    type: object
  Dashboard:
    properties:
      current:
        $ref: '#/definitions/DashboardCurrent'
      recentStreams:
        items:
          $ref: '#/definitions/RecentStream'
        type: array
      stats:
        $ref: '#/definitions/DashboardStats'
    type: object
  DashboardCurrent:
    properties:
      startedAt:
        type: string
      status:
        type: string
      streamId:
        type: string
      title:
        type: string
      viewerCount:
        type: integer
    type: object
  DashboardStats:
    properties:
      liveSeconds:
        type: integer
      range:
        enum:
        - 7d
        - 28d
        type: string
      streamCount:
        type: integer
      vodReadyHidden:
        type: integer
      vodReadyPublic:
        type: integer
    type: object
  Data-Settings:
    properties:
      data:
        $ref: '#/definitions/Settings'
    type: object
  Data-Stream:
    properties:
      data:
        $ref: '#/definitions/Stream'
    type: object
  Data-StudioVOD:
    properties:
      data:
        $ref: '#/definitions/StudioVOD'
    type: object
  Data-VOD:
    properties:
      data:
        $ref: '#/definitions/VOD'
    type: object
  Data-internal_controller_restapi_v1_ContinueList:
    properties:
      data:
        $ref: '#/definitions/ContinueList'
    type: object
  Data-internal_controller_restapi_v1_Dashboard:
    properties:
      data:
        $ref: '#/definitions/Dashboard'
    type: object
  Data-internal_controller_restapi_v1_Playback:
    properties:
      data:
        $ref: '#/definitions/Playback'
    type: object
  Data-internal_controller_restapi_v1_StreamKeyCreated:
    properties:
      data:
        $ref: '#/definitions/StreamKeyCreated'
    type: object
  Data-internal_controller_restapi_v1_StreamKeyInfo:
    properties:
      data:
        $ref: '#/definitions/StreamKeyInfo'
    type: object
  Data-internal_controller_restapi_v1_StreamList:
    properties:
      data:
        $ref: '#/definitions/StreamList'
    type: object
  Data-internal_controller_restapi_v1_Studio:
    properties:
      data:
        $ref: '#/definitions/Studio'
    type: object
  Data-internal_controller_restapi_v1_StudioVODList:
    properties:
      data:
        $ref: '#/definitions/StudioVODList'
    type: object
  Data-internal_controller_restapi_v1_VODList:
    properties:
      data:
        $ref: '#/definitions/VODList'
    type: object
  ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/ErrorBody'
    type: object
  Health:
    properties:
      bitrateKbps:
        type: number
      droppedFrames:
        type: integer
      fps:
        type: number
      reportedAt:
        type: string
      speed:
        type: number
      uploadErrors:
        type: integer
    type: object
  Mature:
    properties:
      acknowledged:
        type: boolean
      required:
        type: boolean
    type: object
  Playback:
    properties:
      anonId:
        description: AnonID is echoed (or generated) for guests; the client stores
          it and sends it back in X-NXL-Anon-Id.
        type: string
      expiresAt:
        type: string
      manifestUrl:
        type: string
      mature:
        $ref: '#/definitions/Mature'
      sessionId:
        type: string
    type: object
  PlaybackRequest:
    properties:
      acknowledgeMature:
        description: AcknowledgeMature confirms the viewer is 18+; signed-in viewers
          are not asked again for the channel.
        type: boolean
    type: object
  ProgressRequest:
    properties:
      keepFurther:
        description: KeepFurther keeps the stored position when it is further (merging
          a browser's local progress on sign-in).
        type: boolean
      positionSec:
        type: integer
    type: object
  RecentStream:
    properties:
      durationSec:
        type: integer
      endReason:
        type: string
      endedAt:
        type: string
      peakViewers:
        type: integer
      startedAt:
        type: string
      streamId:
        type: string
      title:
        type: string
      vodId:
        type: string
      vodVisibility:
        type: string
    type: object
  Settings:
    properties:
      categoryId:
        description: CategoryID is a channel-svc category (GET /v1/categories); null
          = none.
        type: string
      isMature:
        type: boolean
      language:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  SettingsRequest:
    properties:
      categoryId:
        description: 'CategoryID: absent or null removes the category (PUT replaces
          the settings).'
        type: string
      isMature:
        type: boolean
      language:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  Stream:
    properties:
      category:
        $ref: '#/definitions/CategoryRef'
      channel:
        $ref: '#/definitions/Channel'
      channelId:
        type: string
      endReason:
        type: string
      endedAt:
        type: string
      id:
        type: string
      isMature:
        type: boolean
      language:
        type: string
      manifestUrl:
        type: string
      scheduleId:
        description: |-
          ScheduleID and ScheduledStartAt are set for a stream that comes from a schedule (status SCHEDULED, CANCELLED,
          or LIVE / ENDED once attached).
        type: string
      scheduledStartAt:
        type: string
      startedAt:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      thumbnailUrl:
        type: string
      title:
        type: string
      viewerCount:
        description: ViewerCount is the number of people watching right now; null
          when unknown or not on air.
        type: integer
      vodId:
        type: string
    type: object
  StreamKeyCreated:
    properties:
      rtmpUrl:
        type: string
      streamKey:
        type: string
    type: object
  StreamKeyInfo:
    properties:
      createdAt:
        type: string
      hasKey:
        type: boolean
      rtmpUrl:
        type: string
    type: object
  StreamList:
    properties:
      items:
        items:
          $ref: '#/definitions/Stream'
        type: array
      nextCursor:
        type: string
    type: object
  Studio:
    properties:
      channel:
        $ref: '#/definitions/Channel'
      current:
        $ref: '#/definitions/StudioStream'
      settings:
        $ref: '#/definitions/Settings'
    type: object
  StudioStream:
    properties:
      health:
        $ref: '#/definitions/Health'
      interruptedAt:
        type: string
      manifestUrl:
        type: string
      startedAt:
        type: string
      status:
        type: string
      streamId:
        type: string
    type: object
  StudioVOD:
    properties:
      category:
        $ref: '#/definitions/CategoryRef'
      createdAt:
        type: string
      durationSec:
        type: integer
      expiresAt:
        type: string
      id:
        type: string
      manifestUrl:
        type: string
      status:
        enum:
        - READY
        - EXPIRED
        type: string
      streamId:
        type: string
      thumbnailUrl:
        type: string
      title:
        type: string
      visibility:
        enum:
        - PUBLIC
        - HIDDEN
        type: string
    type: object
  StudioVODList:
    properties:
      items:
        items:
          $ref: '#/definitions/StudioVOD'
        type: array
      nextCursor:
        type: string
    type: object
  VOD:
    properties:
      category:
        $ref: '#/definitions/CategoryRef'
      channel:
        $ref: '#/definitions/Channel'
      channelId:
        type: string
      createdAt:
        type: string
      durationSec:
        type: integer
      expiresAt:
        type: string
      id:
        type: string
      isMature:
        type: boolean
      manifestUrl:
        type: string
      status:
        type: string
      streamId:
        type: string
      thumbnailUrl:
        type: string
      title:
        type: string
      viewer:
        allOf:
        - $ref: '#/definitions/VODViewer'
        description: Viewer is present only when the request carries a valid token.
      visibility:
        enum:
        - PUBLIC
        - HIDDEN
        type: string
    type: object
  VODList:
    properties:
      items:
        items:
          $ref: '#/definitions/VOD'
        type: array
      nextCursor:
        type: string
    type: object
  VODPatchRequest:
    properties:
      title:
        type: string
      visibility:
        enum:
        - PUBLIC
        - HIDDEN
        type: string
    type: object
  VODViewer:
    properties:
      positionSec:
        type: integer
    type: object
info:
  contact: {}
  description: Stream keys, Studio, live catalog and VODs. Get a token from identity-svc
    (http://localhost:8090/swagger/index.html → /auth/login) and paste "Bearer <accessToken>"
    into Authorize.
  title: NexusLive stream-svc API
  version: "1.0"
paths:
  /channels/{id}/vods:
    get:
      parameters:
      - description: channel id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - default: 24
        description: 1–50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_VODList'
        "400":
          description: VALIDATION_FAILED (cursor = INVALID)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: A channel's public VODs (Video tab), newest first
      tags:
      - vods
  /me/continue-watching:
    get:
      description: Positions below 5 s and VODs watched to within 10 s of the end
        are left out, like expired VODs.
      parameters:
      - default: 12
        description: 1–50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_ContinueList'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: VODs the signed-in viewer has not finished, newest first
      tags:
      - playback
  /me/watch-progress/{vodId}:
    put:
      consumes:
      - application/json
      description: Clients send it at most every 15 s and when leaving. keepFurther=true
        keeps a further stored position (used to merge a browser's local progress
        after sign-in).
      parameters:
      - description: vod id (uuid)
        in: path
        name: vodId
        required: true
        type: string
      - description: position
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ProgressRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save the VOD position of the signed-in viewer
      tags:
      - playback
  /streams:
    get:
      description: sort=viewers (default; trending is the same) orders by live viewers,
        then the most recent start; sort=newest by start. category is 1–30 category
        ids (comma-separated, from GET /v1/categories); tags must all match. channel
        is null for streams whose channel is unknown to stream-svc.
      parameters:
      - default: live
        description: only live
        enum:
        - live
        in: query
        name: status
        type: string
      - description: category ids, comma-separated
        in: query
        name: category
        type: string
      - description: two-letter language code
        in: query
        name: language
        type: string
      - description: up to 5 tags, comma-separated
        in: query
        name: tags
        type: string
      - default: viewers
        description: order
        enum:
        - viewers
        - newest
        - trending
        in: query
        name: sort
        type: string
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - default: 24
        description: page size (1–50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_StreamList'
        "400":
          description: VALIDATION_FAILED (category = INVALID, language = FORMAT, tags
            = TAG_COUNT, sort = ENUM, cursor = INVALID)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Streams on air (LIVE and INTERRUPTED), mature ones included (isMature)
      tags:
      - streams
  /streams/{id}:
    get:
      description: 'status may be SCHEDULED (an announced occurrence: scheduleId,
        scheduledStartAt) or CANCELLED. vodId is null while the VOD is hidden, except
        for the channel owner.'
      parameters:
      - description: stream id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-Stream'
        "401":
          description: UNAUTHORIZED (token sent but invalid)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream detail (status, manifestUrl, vodId once the VOD is ready)
      tags:
      - streams
  /streams/{id}/playback:
    post:
      consumes:
      - application/json
      description: Guests may call it; send X-NXL-Anon-Id when you have one. Mature
        streams return mature.required=true and no manifestUrl until called again
        with acknowledgeMature=true (signed-in viewers are remembered per channel).
        With STREAM_HLS_SIGNING the manifestUrl is /hls/t/{expires}/{md5}/streams/{id}/master.m3u8,
        valid until expiresAt; a suspended channel answers 403 CHANNEL_SUSPENDED.
      parameters:
      - description: stream id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: guest browser id (uuid)
        in: header
        name: X-NXL-Anon-Id
        type: string
      - description: age confirmation
        in: body
        name: body
        schema:
          $ref: '#/definitions/PlaybackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Playback'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED (token sent but invalid)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open a live (or ended) stream for playback
      tags:
      - playback
  /streams/recommended:
    get:
      description: LIVE only (not INTERRUPTED), never 18+, by viewers then the most
        recent start. Not paged (nextCursor is null).
      parameters:
      - default: 12
        description: 1–24
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_StreamList'
      summary: Recommended live streams (Hero, "Live đề xuất", Guest sidebar)
      tags:
      - streams
  /studio/dashboard:
    get:
      description: Counted on the tables directly. Followers and the next broadcast
        come from GET /v1/studio/channel/stats (channel-svc).
      parameters:
      - default: 7d
        description: period
        enum:
        - 7d
        - 28d
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Dashboard'
        "400":
          description: VALIDATION_FAILED (range = ENUM)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Studio dashboard: the broadcast on air, the last 5 broadcasts and
        counts over the range'
      tags:
      - studio
  /studio/stream:
    get:
      description: current is null when the channel is offline; health is the latest
        ingest report (5 s).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Studio'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Studio: the creator''s channel, settings and the current broadcast'
      tags:
      - studio
    put:
      consumes:
      - application/json
      description: Applies to the next broadcast and to the one on air, if any. Title
        1–140, at most 10 tags of ≤ 25 characters.
      parameters:
      - description: Settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-Settings'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR, CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update title / tags / mature flag
      tags:
      - studio
  /studio/stream-key:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_StreamKeyInfo'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream key status (never the key itself)
      tags:
      - studio
    post:
      description: The key is returned only here, once. The previous key stops working
        immediately.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_StreamKeyCreated'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR, CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create / regenerate the stream key
      tags:
      - studio
  /studio/stream/end:
    post:
      description: Moves the stream to ENDED; media-svc disconnects OBS and publishes
        the VOD.
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: NOT_LIVE
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: End the broadcast
      tags:
      - studio
  /studio/vods:
    get:
      parameters:
      - description: filter
        enum:
        - PUBLIC
        - HIDDEN
        in: query
        name: visibility
        type: string
      - description: filter
        enum:
        - READY
        - EXPIRED
        in: query
        name: status
        type: string
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - default: 24
        description: 1–50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_StudioVODList'
        "400":
          description: VALIDATION_FAILED (visibility / status = ENUM, cursor = INVALID)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Studio: the channel''s VODs (READY and EXPIRED, hidden ones included),
        newest first'
      tags:
      - studio
  /studio/vods/{id}:
    delete:
      description: Soft delete; media-svc then removes its files (vod.deleted.v1).
        A VOD already deleted is 404.
      parameters:
      - description: vod id (uuid)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Studio: delete a VOD'
      tags:
      - studio
    patch:
      consumes:
      - application/json
      description: A hidden VOD disappears from every public list, search and continue-watching;
        its URL is 404 for everyone but the owner.
      parameters:
      - description: vod id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/VODPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-StudioVOD'
        "400":
          description: VALIDATION_FAILED (body = REQUIRED, title = LENGTH, visibility
            = ENUM)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: INVALID_STATE (EXPIRED)
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Studio: rename, hide or show a VOD'
      tags:
      - studio
  /vods:
    get:
      parameters:
      - description: category ids, comma-separated
        in: query
        name: category
        type: string
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - default: 24
        description: 1–50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_VODList'
        "400":
          description: VALIDATION_FAILED (category = INVALID, cursor = INVALID)
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Public VODs (READY, PUBLIC, not expired), newest first
      tags:
      - vods
  /vods/{id}:
    get:
      description: With a token, viewer.positionSec is the caller's saved position
        (null when never watched). A HIDDEN VOD is 404 except for its channel owner.
      parameters:
      - description: vod id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-VOD'
        "401":
          description: UNAUTHORIZED (token sent but invalid)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: VOD (READY and not expired)
      tags:
      - vods
  /vods/{id}/playback:
    post:
      consumes:
      - application/json
      description: Same rules as /streams/{id}/playback; a VOD inherits the mature
        flag of its broadcast.
      parameters:
      - description: vod id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: guest browser id (uuid)
        in: header
        name: X-NXL-Anon-Id
        type: string
      - description: age confirmation
        in: body
        name: body
        schema:
          $ref: '#/definitions/PlaybackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Playback'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHORIZED (token sent but invalid)
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open a VOD for playback
      tags:
      - playback
  /vods/recommended:
    get:
      parameters:
      - default: 12
        description: 1–24
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_VODList'
      summary: Recommended VODs (newest public ones, never 18+); not paged
      tags:
      - vods
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
