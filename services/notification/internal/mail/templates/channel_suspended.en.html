<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Channel suspended</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Channel suspended</h1>
      <p style="margin:0 0 12px">Hi {{.Name}},</p>
      <p style="margin:0 0 16px">An administrator suspended your channel {{.Channel}}. It cannot go live and is hidden from viewers until it is restored.</p>
      <p style="margin:0 0 16px">Reason: {{.Reason}}</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Open Studio</a></p>
    </td></tr>
  </table>
</body>
</html>
