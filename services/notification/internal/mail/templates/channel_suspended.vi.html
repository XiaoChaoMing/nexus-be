<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Kênh bị khóa</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Kênh bị khóa</h1>
      <p style="margin:0 0 12px">Chào {{.Name}},</p>
      <p style="margin:0 0 16px">Kênh {{.Channel}} của bạn đã bị quản trị viên khóa. Kênh không phát được và không hiện với người xem cho tới khi được mở lại.</p>
      <p style="margin:0 0 16px">Lý do: {{.Reason}}</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Mở Studio</a></p>
    </td></tr>
  </table>
</body>
</html>
