<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{.Channel}} is live</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">{{.Channel}} is live</h1>
      <p style="margin:0 0 12px">Hi {{.Name}},</p>
      <p style="margin:0 0 16px">{{.Channel}} just went live: {{.Title}}</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Watch now</a></p>
      <p style="margin:0 0 8px;font-size:13px;color:#a0a0b8">You get this e-mail because you follow {{.Channel}} with live notifications on.</p>
      <p style="margin:0;font-size:13px;color:#a0a0b8">Don't want these e-mails? <a href="{{.UnsubscribeURL}}" style="color:#a0a0b8">Unsubscribe</a></p>
    </td></tr>
  </table>
</body>
</html>
