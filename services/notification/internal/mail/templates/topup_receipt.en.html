<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wallet top-up received</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Wallet top-up {{.Invoice}} received</h1>
      <p style="margin:0 0 12px">Hi {{.Name}},</p>
      <p style="margin:0 0 16px">You added <strong>{{.Amount}}</strong> to your NexusLive wallet (payment {{.Invoice}}, {{.Method}}, at {{.When}}).</p>
      <p style="margin:0 0 16px">Your balance is for gifts to streamers; it cannot be withdrawn or refunded.</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">View your wallet</a></p>
      <p style="margin:0 0 8px;font-size:13px;color:#a0a0b8">This is a mandatory transactional e-mail.</p>
    </td></tr>
  </table>
</body>
</html>
