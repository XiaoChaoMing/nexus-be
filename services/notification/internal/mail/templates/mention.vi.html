<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Bạn được nhắc tới</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Bạn được nhắc tới</h1>
      <p style="margin:0 0 12px">Chào {{.Name}},</p>
      <p style="margin:0 0 16px">{{.Sender}} đã nhắc bạn trong chat:</p>
      <p style="margin:0 0 16px">“{{.Excerpt}}”</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Mở buổi phát</a></p>
      <p style="margin:0 0 8px;font-size:13px;color:#a0a0b8">Bạn nhận email này vì đã bật email cho thông báo nhắc tên (@mention).</p>
      <p style="margin:0;font-size:13px;color:#a0a0b8">Không muốn nhận loại email này? <a href="{{.UnsubscribeURL}}" style="color:#a0a0b8">Hủy nhận</a></p>
    </td></tr>
  </table>
</body>
</html>
