<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Nạp ví thành công</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Nạp ví thành công {{.Invoice}}</h1>
      <p style="margin:0 0 12px">Chào {{.Name}},</p>
      <p style="margin:0 0 16px">Bạn đã nạp <strong>{{.Amount}}</strong> vào ví NexusLive (giao dịch {{.Invoice}}, {{.Method}}, lúc {{.When}}).</p>
      <p style="margin:0 0 16px">Số dư ví dùng để tặng quà cho streamer; số dư không rút và không hoàn lại.</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Xem ví</a></p>
      <p style="margin:0 0 8px;font-size:13px;color:#a0a0b8">Đây là email giao dịch bắt buộc.</p>
    </td></tr>
  </table>
</body>
</html>
