<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Tài khoản tạm khóa</title></head>
<body style="margin:0;padding:24px;background:#0f0f14;font-family:Arial,Helvetica,sans-serif;color:#e8e8f0">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#181822;border-radius:12px">
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Tài khoản tạm khóa</h1>
      <p style="margin:0 0 12px">Chào {{.Username}},</p>
      <p style="margin:0 0 16px">Tài khoản NexusLive của bạn vừa bị tạm khóa trong {{.ValidFor}} vì có nhiều lần đăng nhập sai mật khẩu liên tiếp.</p>
      <p style="margin:0 0 16px">Nếu đó là bạn, hãy chờ hết thời gian khóa rồi đăng nhập lại. Nếu không phải bạn, hãy đặt lại mật khẩu ngay.</p>
      <p style="margin:8px 0 24px"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#7c5cff;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold">Đặt lại mật khẩu</a></p>
    </td></tr>
  </table>
</body>
</html>
