      security:
      - BearerAuth: []
      summary: Stop renewal reminders
      tags:
      - subscriptions
  /me/subscriptions/{id}/resume:
    post:
      description: CANCELLED_PENDING_END → ACTIVE while the period runs; otherwise
        409.
      parameters:
      - description: subscription id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-Sub'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: INVALID_STATE
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Turn renewal reminders back on
      tags:
      - subscriptions
  /me/wallet:
    get:
      description: Σ credits − Σ debits of the wallet (VND); negative after a spent
        top-up was voided.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Wallet'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The caller's wallet balance
      tags:
      - wallet
  /me/wallet/entries:
    get:
      description: Newest first. kind TOPUP | TOPUP_VOID (invoiceNumber set) or GIFT_SPEND
        (gift set).
      parameters:
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 1–50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Page-internal_controller_restapi_v1_WalletEntry'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The caller's wallet history
      tags:
      - wallet
  /studio/monetization/ledger:
    get:
      description: 'Append-only entries, newest first: SUB_REVENUE / PLATFORM_FEE
        of each payment (reversed by a void) and PAYOUT debits.'
      parameters:
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 1–50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Page-internal_controller_restapi_v1_LedgerEntry'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The channel ledger
      tags:
      - studio-monetization
  /studio/monetization/payouts:
    get:
      parameters:
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 1–50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Page-Payout'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The channel's payout requests
      tags:
      - studio-monetization
    post:
      consumes:
      - application/json
      description: 'amount: integer 100000–1000000000 (REQUIRED / MIN / MAX); bankCode
        one of VCB, TCB, BIDV, VTB, ACB, MB, VPB, TPB, STB, VIB, SHB, HDB (ENUM);
        accountNumber 6–20 digits (FORMAT); accountName is trimmed, spaces collapsed,
        upper-cased, 2–100 chars (LENGTH), A–Z and spaces only (FORMAT). 409 INVALID_STATE
        details.reason: INSUFFICIENT_BALANCE (+ available) or PAYOUT_PENDING. Requires
        Idempotency-Key.'
      parameters:
      - description: UUID
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: payout
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PayoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Data-Payout'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR / CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: INVALID_STATE / CONFLICT
          schema:
            $ref: '#/definitions/Error'
        "422":
          description: IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Request a payout
      tags:
      - studio-monetization
  /studio/monetization/summary:
    get:
      description: Gross, platform fee (5%, rounded down) and net over the range (days
        start at 00:00 in tz), today's net for the dashboard tile, the ledger balance,
        pending payouts and live subscribers.
      parameters:
      - description: 7d (default) | 28d
        in: query
        name: range
        type: string
      - description: IANA time zone, default Asia/Ho_Chi_Minh
        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Summary'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Monetization overview
      tags:
      - studio-monetization
  /studio/monetization/tiers:
    get:
      description: Every tier of the caller's channel, inactive ones included, with
        live subscriber counts. No channel → 403 NOT_CREATOR.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Page-internal_controller_restapi_v1_StudioTier'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The Creator's tiers
      tags:
      - studio-monetization
  /studio/monetization/tiers/{level}:
    patch:
      consumes:
      - application/json
      description: Prices are fixed. Tier 1 cannot be turned off (active = INVALID);
        description ≤ 200 characters after trim; an empty body → body = REQUIRED.
      parameters:
      - description: 1–3
        in: path
        name: level
        required: true
        type: integer
      - description: changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/TierPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-StudioTier'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: NOT_CREATOR / CHANNEL_SUSPENDED
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Turn a tier on / off or edit its description
      tags:
      - studio-monetization
  /webhooks/sepay:
    post:
      consumes:
      - application/json
      description: Called by SePay with X-Secret-Key. 200 {"success":true} when applied,
        a duplicate, ignored, not approved, an unknown invoice or an amount mismatch
        (the order becomes FAILED AMOUNT_MISMATCH); 401 wrong secret; 400 malformed
        or over 64 KB; 500 temporary error (SePay retries).
      parameters:
      - description: IPN secret
        in: header
        name: X-Secret-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: SePay IPN
      tags:
      - webhooks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
