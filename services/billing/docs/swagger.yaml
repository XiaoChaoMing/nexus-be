info:
  contact: {}
  description: Subscription tiers, checkout (SePay Payment Gateway or the dev fake),
    the SePay IPN webhook, the viewer's subscriptions and payments, Studio monetization
    (tiers, overview, ledger, payouts) and the admin payout queue. Get a token from
    identity-svc (http://localhost:8090/swagger/index.html → /auth/login; admin@nexuslive.dev
    for /admin) and paste "Bearer <accessToken>" into Authorize.
  title: NexusLive billing-svc API
  version: "1.0"
paths:
  /admin/checkout-orders:
    get:
      description: Newest first. needsReview=true lists paid orders that could not
        be applied (another tier was live); status and failureReason are CSV (AND);
        q (case-insensitive) is a whole invoice number (exact match) or a prefix of
        one.
      parameters:
      - description: true | false
        in: query
        name: needsReview
        type: boolean
      - description: CSV of order statuses
        in: query
        name: status
        type: string
      - description: CSV of CANCELLED_BY_USER | DECLINED | EXPIRED | AMOUNT_MISMATCH
          | PROVIDER_ERROR | UNKNOWN
        in: query
        name: failureReason
        type: string
      - description: invoice number, exact (NXL + 10 characters) or prefix
        in: query
        name: q
        type: string
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      - description: 1–50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Page-internal_controller_restapi_v1_AdminOrder'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Checkout orders (review page)
      tags:
      - admin-billing
  /admin/checkout-orders/{id}:
    get:
      description: id is the order id or its invoice number (case-insensitive). Any
        order, whatever its status.
      parameters:
      - description: order id or invoice number
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-AdminOrder'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: A checkout order (review panel)
      tags:
      - admin-billing
  /admin/gift-items:
    get:
      parameters:
      - description: 'true | false (default: all)'
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Data-internal_controller_restapi_v1_Items-internal_controller_restapi_v1_AdminGiftItem'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: The gift catalog (admin)
